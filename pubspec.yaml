name: quizt_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 認証（Amplify）
  amplify_flutter: ^2.5.0
  amplify_auth_cognito: ^2.5.0

  # ローカルDB
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ローカル通知
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # HTTP
  http: ^1.2.1

  # アイコン
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # コード生成
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true